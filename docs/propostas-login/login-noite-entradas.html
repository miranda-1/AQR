<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AQR: login noite, entradas</title>
<!--
  Decisão do responsável (09/10/2026): login "Noite" (anéis pontilhados em azul profundo, com brilho e pulso ao digitar).
  Três animações depois de "Entrar": #a1 o pontilhado continua, #a2 logo em pontinhos, #a3 anel vira lente.
  Arquivo estático: abra no navegador a partir do repositório. Nada aqui autentica de verdade.
-->
<style>
  @font-face {
    font-family: 'Jakarta';
    src: url('../../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2');
    font-weight: 200 800;
  }
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  :root {
    --blue: #283587; --blue-50: #eef0f8; --blue-800: #1d2766;
    --yellow: #ffcc00; --ink: #1b2040; --muted: #4a5072;
    --sunken: #f4f5f9; --line-strong: #8d92ab;
    --shadow-surface: 0 1px 2px rgba(27,32,64,.06), 0 2px 6px -2px rgba(27,32,64,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Jakarta', system-ui, sans-serif; color: var(--ink); background: var(--sunken); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .switcher { position: fixed; z-index: 60; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px;
    background: rgba(10,14,40,.85); border-radius: 999px; box-shadow: 0 8px 24px -8px rgba(0,0,0,.4); max-width: calc(100vw - 16px); overflow-x: auto; }
  .switcher a { color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px; white-space: nowrap; }
  .switcher a[aria-current='true'] { background: #fff; color: var(--ink); }

  /* ---------- Palco "Noite" ---------- */
  .stage { position: relative; z-index: 2; min-height: 100vh; overflow: hidden;
    background: radial-gradient(circle at 50% 46%, #33419a 0, var(--blue) 30%, var(--blue-800) 68%, #151b4d 100%); }
  .stage.curtain { transform: translateY(-100%); transition: transform .8s cubic-bezier(.7,0,.2,1); }
  .scene { position: relative; z-index: 2; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 16px 96px; }

  .rings { position: absolute; left: 50%; top: 50%; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; pointer-events: none;
    transition: transform 1.2s cubic-bezier(.6,0,.3,1), opacity 1s ease; }
  .rings svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: breathe 9s ease-in-out infinite; }
  .rings circle { fill: none; stroke-linecap: round; transform-box: view-box; transform-origin: 700px 700px; }
  .rings circle.cw { animation: spin var(--d) linear infinite; }
  .rings circle.ccw { animation: spin var(--d) linear infinite reverse; }
  .rings .glow { -webkit-mask-image: conic-gradient(from var(--a), transparent 0 290deg, rgba(0,0,0,.4) 330deg, #000 360deg);
    mask-image: conic-gradient(from var(--a), transparent 0 290deg, rgba(0,0,0,.4) 330deg, #000 360deg);
    animation: breathe 9s ease-in-out infinite, sweep 7s linear infinite; }
  .rings.pulse svg.base { animation: pulse .5s ease-out; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(.97); } 50% { transform: scale(1.03); } }
  @keyframes sweep { to { --a: 360deg; } }
  @keyframes pulse { 0% { transform: scale(1); } 35% { transform: scale(1.035); } 100% { transform: scale(1); } }

  /* A1: os anéis se aproximam e brilham durante a entrada; no fim, abrem como onda. */
  .rings.focus { transform: scale(.78); }
  .rings.focus .glow { animation-duration: 9s, 2.4s; }
  .rings.focus svg.base { opacity: 1.6; filter: brightness(1.6); }
  .rings.wave-out { transform: scale(2.4); opacity: 0; transition: transform 1.1s cubic-bezier(.3,0,.2,1), opacity 1s ease; }
  /* A2 e A3: os anéis recuam enquanto os pontos ou o anel amarelo assumem. */
  .rings.dim { opacity: .25; }

  /* ---------- Cartão 2B ---------- */
  .stack { position: relative; width: 100%; max-width: 440px; transition: opacity .45s ease, transform .45s ease; }
  .stack.leaving { opacity: 0; transform: translateY(-8px) scale(.97); pointer-events: none; }
  .sheet { position: absolute; inset: 0; background: #fff; border-radius: 16px; box-shadow: 0 8px 24px -10px rgba(5,10,40,.45); transform-origin: 50% 100%; }
  .sheet.s1 { animation: fan1 1.1s .25s cubic-bezier(.2,.7,.2,1) both, sway1 9s 1.4s ease-in-out infinite; }
  .sheet.s2 { animation: fan2 1.1s .35s cubic-bezier(.2,.7,.2,1) both, sway2 9s 1.5s ease-in-out infinite; background: var(--blue-50); }
  @keyframes fan1 { from { transform: none; } to { transform: rotate(-6deg) translate(-18px, 6px); } }
  @keyframes fan2 { from { transform: none; } to { transform: rotate(5deg) translate(18px, 8px); } }
  @keyframes sway1 { 0%, 100% { transform: rotate(-6deg) translate(-18px, 6px); } 50% { transform: rotate(-4.5deg) translate(-14px, 4px); } }
  @keyframes sway2 { 0%, 100% { transform: rotate(5deg) translate(18px, 8px); } 50% { transform: rotate(3.5deg) translate(14px, 6px); } }
  .card { position: relative; background: #fff; border-radius: 16px; box-shadow: 0 30px 60px -20px rgba(5,10,40,.55); padding: 40px 40px 34px; }

  .prefcg { display: block; height: 34px; width: auto; margin: 0 auto; }
  .aqr { display: inline-flex; align-items: center; font-weight: 800; letter-spacing: -0.025em; line-height: 1; color: var(--blue); user-select: none; }
  .system { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 26px; }
  .system small { font-size: 13px; color: var(--muted); line-height: 1.3; }
  .accent { width: 40px; height: 4px; border-radius: 2px; background: var(--yellow); margin: 22px auto 0; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-top: 20px; text-align: center; }
  .lead { margin-top: 6px; font-size: 15px; color: var(--muted); text-align: center; }
  form { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .field { position: relative; }
  input { width: 100%; height: 46px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff; padding: 0 14px; font: inherit; font-size: 15px; color: var(--ink);
    transition: border-color .15s, box-shadow .15s; }
  input:focus-visible { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(40,53,135,.22); }
  .reveal { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); height: 34px; padding: 0 10px; border: 0; background: transparent; border-radius: 6px;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--blue); cursor: pointer; }
  .reveal:hover { background: var(--blue-50); }
  .submit { height: 48px; border: 0; border-radius: 8px; background: var(--blue); color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 4px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .15s; }
  .submit:hover { background: var(--blue-800); }
  .submit:active { transform: translateY(1px); }
  .submit svg { transition: transform .2s; }
  .submit:hover svg { transform: translateX(3px); }
  .help { margin-top: 18px; font-size: 13.5px; color: var(--muted); text-align: center; }
  .enter > * { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .enter > *:nth-child(2) { animation-delay: .08s; } .enter > *:nth-child(3) { animation-delay: .14s; }
  .enter > *:nth-child(4) { animation-delay: .2s; } .enter > *:nth-child(5) { animation-delay: .26s; } .enter > *:nth-child(6) { animation-delay: .32s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* Logo que se desenha. --delay atrasa toda a sequência (usado na A2). */
  .draw .ring { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 1s calc(var(--delay, 0s) + .5s) ease-out forwards; }
  .draw .handle { stroke-dasharray: 22; stroke-dashoffset: 22; animation: draw .4s calc(var(--delay, 0s) + 1.3s) ease-out forwards; }
  .draw .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .5s calc(var(--delay, 0s) + 1.5s) ease-out forwards; }
  /* A3: o anel já chega pronto (veio do anel amarelo); só cabo, faixa e letras se desenham. */
  .draw.ring-ready .ring { stroke-dashoffset: 0; animation: none; }
  .draw.ring-ready .handle { animation-delay: .1s; }
  .draw.ring-ready .bar { animation-delay: .35s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes grow { to { transform: scaleX(1); } }

  /* ---------- Entrada ---------- */
  .splash { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    pointer-events: none; opacity: 0; transition: opacity .35s ease; }
  .splash.is-on { opacity: 1; }
  .splash .aqr { position: relative; z-index: 2; font-size: 80px; color: #fff; }
  .splash .letter { display: inline-block; opacity: 0; }
  .splash.is-on .letter.a { animation: from-left .6s calc(var(--delay, 0s) + .35s) cubic-bezier(.2,.7,.2,1) forwards; }
  .splash.is-on .letter.r { animation: from-right .6s calc(var(--delay, 0s) + .35s) cubic-bezier(.2,.7,.2,1) forwards; }
  .splash .name { position: relative; z-index: 2; font-size: 16px; color: rgba(255,255,255,.85); opacity: 0; }
  .splash.is-on .name { animation: rise .6s calc(var(--delay, 0s) + 1.6s) ease-out forwards; }
  @keyframes from-left { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  @keyframes from-right { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }

  /* A2: pontos que formam a logo; A3: anel amarelo que vira lente */
  canvas.particles, svg.morph { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

  .site { position: fixed; inset: 0; z-index: 1; background: var(--sunken); overflow: auto; visibility: hidden; }
  .site.is-on { visibility: visible; }
  .site header { height: 56px; background: #fff; display: flex; align-items: center; gap: 16px; padding: 0 20px; box-shadow: 0 1px 3px rgba(27,32,64,.08), 0 4px 12px -6px rgba(27,32,64,.10); }
  .site header .tools { font-size: 15px; font-weight: 600; }
  .site header .prefcg { margin: 0 0 0 auto; height: 30px; }
  .site main { max-width: 1100px; margin: 0 auto; padding: 56px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  .site.is-on main > * { animation: rise .7s .45s cubic-bezier(.2,.7,.2,1) both; }
  .site.is-on main > *:nth-child(2) { animation-delay: .55s; }
  .site .eyebrow { font-size: 14px; font-weight: 600; color: var(--blue); display: flex; align-items: center; gap: 8px; }
  .site .eyebrow::before { content: ''; width: 24px; height: 4px; border-radius: 2px; background: var(--yellow); }
  .site h2 { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; margin-top: 12px; }
  .site .opt { margin-top: 16px; height: 108px; border-radius: 12px; background: #fff; box-shadow: var(--shadow-surface); }
  .site .opt:first-of-type { margin-top: 32px; }
  .site .panel { border-radius: 12px; background: #fff; box-shadow: var(--shadow-surface); min-height: 380px; }
  .again { position: fixed; z-index: 61; right: 16px; top: 68px; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--blue); cursor: pointer; }

  @media (max-width: 900px) {
    .card { padding: 30px 22px 26px; }
    .site main { grid-template-columns: 1fr; }
    .site .panel { min-height: 220px; }
    .splash .aqr { font-size: 58px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .sheet.s1 { transform: rotate(-6deg) translate(-18px, 6px); }
    .sheet.s2 { transform: rotate(5deg) translate(18px, 8px); }
    .draw .ring, .draw .handle { stroke-dashoffset: 0; }
    .draw .bar { transform: none; }
    .splash .letter, .splash .name { opacity: 1; }
    .stage.curtain { transform: none; opacity: 0; }
  }
</style>
</head>
<body>

<nav class="switcher" aria-label="Animação depois de entrar">
  <a href="#a1">Pontilhado continua</a>
  <a href="#a2">Logo em pontinhos</a>
  <a href="#a3">Anel vira lente</a>
</nav>

<div class="stage" data-stage>
  <div class="rings" aria-hidden="true" data-rings></div>
  <div class="scene">
    <div class="stack" data-stack>
      <div class="sheet s2" aria-hidden="true"></div>
      <div class="sheet s1" aria-hidden="true"></div>
      <div class="card"><div class="enter" data-form></div></div>
    </div>
  </div>
  <canvas class="particles" aria-hidden="true" data-particles></canvas>
  <svg class="morph" aria-hidden="true" data-morph></svg>
  <div class="splash" data-splash role="status" aria-live="polite">
    <span class="aqr" role="img" aria-label="AQR" data-splash-logo></span>
    <span class="name">Análise e Qualificação de Requerimentos</span>
  </div>
</div>

<div class="site" data-site aria-label="Prévia do site após entrar">
  <header>
    <span class="tools">Ferramentas</span>
    <span class="aqr" role="img" aria-label="AQR" style="font-size:22px" data-site-logo></span>
    <img class="prefcg" src="../../src/assets/brand/prefcg-azul.svg" alt="Prefeitura de Campo Grande">
  </header>
  <main>
    <div><p class="eyebrow">Ferramentas AQR</p><h2>Como podemos ajudar?</h2><div class="opt"></div><div class="opt"></div></div>
    <div class="panel"></div>
  </main>
</div>
<button class="again" type="button" data-again hidden>Voltar ao login</button>

<script>
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
  const wait = (ms) => new Promise((r) => timers.push(setTimeout(r, reduced ? 0 : ms)))
  const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2)
  /** Interpola de 0 a 1 em `ms`, chamando step(p) a cada quadro. */
  function tween(ms, step) {
    return new Promise((resolve) => {
      if (reduced) { step(1); return resolve() }
      const t0 = performance.now()
      function f(now) { const p = Math.min(1, (now - t0) / ms); step(p); if (p < 1) rafs.push(requestAnimationFrame(f)); else resolve() }
      rafs.push(requestAnimationFrame(f))
    })
  }

  // ---------- Anéis "Noite" ----------
  const RINGS = [[170, 4, 14], [250, 3, 18], [330, 5, 22], [420, 3, 16], [520, 4, 26], [630, 3, 20]]
  const YELLOW_RING = 2
  const white = (a) => `rgba(255,255,255,${a})`
  function ringsSVG(color, cls) {
    return `<svg class="${cls}" viewBox="0 0 1400 1400">${RINGS.map(([r, dot, gap], i) =>
      `<circle class="${i % 2 ? 'ccw' : 'cw'}" cx="700" cy="700" r="${r}" stroke="${color(i)}" stroke-width="${dot}" stroke-dasharray="0 ${gap}" style="--d:${60 + i * 18}s"/>`).join('')}</svg>`
  }
  const ringsEl = document.querySelector('[data-rings]')
  ringsEl.innerHTML = ringsSVG((i) => (i === YELLOW_RING ? 'rgba(255,204,0,.38)' : white([.20, .15, .13, .11, .09, .07][i])), 'base')
    + ringsSVG((i) => (i === YELLOW_RING ? 'rgba(255,204,0,.95)' : white(.75)), 'glow')

  // ---------- Logo ----------
  function lens(size, draw, tone = 'color', extra = '') {
    const neg = tone === 'negative', s = size * 1.1, main = neg ? '#fff' : 'var(--blue)'
    return `<svg class="${draw ? 'draw' : ''} ${extra}" viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true" style="flex-shrink:0;margin:0 ${size * 0.02}px 0 ${size * 0.04}px;transform:translateY(${size * 0.12}px)">
      <path class="handle" d="M40.5 40.5 L55 55" stroke="${main}" stroke-width="9" stroke-linecap="round"/>
      <circle class="ring" cx="27" cy="27" r="19" fill="${neg ? 'transparent' : '#fff'}" stroke="${main}" stroke-width="7"/>
      <rect class="bar" x="14" y="19.5" width="26" height="8" rx="2" fill="var(--yellow)"/>
      <rect x="17" y="22" width="20" height="3.5" rx="1.75" fill="${neg ? '#fff' : 'var(--blue)'}"/>
      <rect x="17" y="30.5" width="13" height="3.5" rx="1.75" fill="${neg ? 'rgba(255,255,255,.45)' : 'rgba(40,53,135,.35)'}"/></svg>`
  }
  const logo = (size, draw, tone, extra) => `<span class="letter a" aria-hidden="true">A</span>${lens(size, draw, tone, extra)}<span class="letter r" aria-hidden="true">R</span>`
  document.querySelector('[data-site-logo]').innerHTML = logo(22, false).replaceAll('class="letter', 'class="')

  // ---------- Formulário ----------
  const arrow = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
  const wrap = document.querySelector('[data-form]')
  function renderForm() {
    wrap.innerHTML = `
      <img class="prefcg" src="../../src/assets/brand/prefcg-azul.svg" alt="Prefeitura de Campo Grande" height="34">
      <div class="system"><span class="aqr" role="img" aria-label="AQR" style="font-size:24px">${logo(24, true)}</span>
        <small>Análise e Qualificação<br>de Requerimentos</small></div>
      <div class="accent" aria-hidden="true"></div>
      <div><h1>Entrar</h1><p class="lead">Use seu usuário e senha da SEMADES.</p></div>
      <form data-login>
        <div><label for="u">Usuário</label><input id="u" autocomplete="username"></div>
        <div><label for="p">Senha</label><div class="field"><input id="p" type="password" autocomplete="current-password" style="padding-right:84px">
          <button type="button" class="reveal" aria-pressed="false">Mostrar</button></div></div>
        <button class="submit" type="submit">Entrar ${arrow}</button>
      </form>
      <p class="help">Esqueceu a senha? Procure o suporte da SEMADES.</p>`
    wrap.querySelector('.reveal').addEventListener('click', (e) => {
      const b = e.currentTarget, i = b.previousElementSibling, show = i.type === 'password'
      i.type = show ? 'text' : 'password'; b.textContent = show ? 'Ocultar' : 'Mostrar'; b.setAttribute('aria-pressed', String(show))
    })
    // Cada tecla faz os anéis pulsarem de leve.
    wrap.querySelectorAll('input').forEach((input) => input.addEventListener('input', () => {
      ringsEl.classList.remove('pulse'); void ringsEl.offsetWidth; ringsEl.classList.add('pulse')
    }))
    wrap.querySelector('[data-login]').addEventListener('submit', (e) => { e.preventDefault(); enterSite() })
  }

  // ---------- Entrada ----------
  const stage = document.querySelector('[data-stage]')
  const stack = document.querySelector('[data-stack]')
  const splash = document.querySelector('[data-splash]')
  const splashLogo = splash.querySelector('[data-splash-logo]')
  const site = document.querySelector('[data-site]')
  const again = document.querySelector('[data-again]')
  const particles = document.querySelector('[data-particles]')
  const morph = document.querySelector('[data-morph]')
  let timers = [], rafs = [], mode = 'a1', running = 0

  async function finish(afterMs) {
    await wait(afterMs)
    site.classList.add('is-on'); stage.classList.add('curtain'); again.hidden = false
  }

  const entrances = {
    // A1: o pontilhado continua; os anéis se aproximam e brilham, a logo se desenha, e no fim os anéis abrem como onda.
    async a1(run) {
      splashLogo.innerHTML = logo(80, true, 'negative')
      ringsEl.classList.add('focus')
      await wait(300); if (run !== running) return
      splash.classList.add('is-on')
      await wait(2300); if (run !== running) return
      ringsEl.classList.add('wave-out')
      await finish(500)
    },

    // A2: pontos saem dos anéis e formam a logo; depois a logo de verdade se desenha por cima.
    async a2(run) {
      splashLogo.innerHTML = logo(80, true, 'negative')
      splash.style.setProperty('--delay', '1.9s')
      splash.classList.add('is-on')             // já ocupa o lugar (invisível até as letras e a lente aparecerem)
      await document.fonts.ready
      const targets = sampleLogo()
      const W = stage.clientWidth, H = stage.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2)
      particles.width = W * dpr; particles.height = H * dpr
      const ctx = particles.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      // Origem de cada ponto: um ponto aleatório de um dos anéis (em tela).
      const cx = W / 2, cy = H / 2
      const dots = targets.map(([tx, ty, yellow]) => {
        const [r] = RINGS[Math.floor(Math.random() * RINGS.length)], ang = Math.random() * Math.PI * 2
        return { sx: cx + Math.cos(ang) * r, sy: cy + Math.sin(ang) * r, tx, ty, yellow, delay: Math.random() * 0.35 }
      })
      ringsEl.classList.add('dim')
      await tween(1500, (p) => {
        if (run !== running) return
        ctx.clearRect(0, 0, W, H)
        for (const d of dots) {
          const q = ease(Math.max(0, Math.min(1, (p - d.delay) / (1 - d.delay))))
          const x = d.sx + (d.tx - d.sx) * q, y = d.sy + (d.ty - d.sy) * q
          ctx.fillStyle = d.yellow ? 'rgba(255,204,0,.95)' : `rgba(255,255,255,${0.35 + 0.6 * q})`
          ctx.beginPath(); ctx.arc(x, y, 1.6 + q * 0.6, 0, Math.PI * 2); ctx.fill()
        }
      })
      if (run !== running) return
      // O "AQR" em pontinhos fica um instante sozinho; depois os pontos se apagam enquanto a logo sólida se desenha.
      await wait(600); if (run !== running) return
      await tween(1400, (p) => { particles.style.opacity = String(1 - p) })
      await finish(1300)
    },

    // A3: o anel amarelo encolhe até a lente da logo, fecha em anel contínuo, e dele nascem o cabo, a faixa e as letras.
    async a3(run) {
      // Mede onde a lente da logo vai ficar (o splash já tem layout, mesmo invisível).
      splashLogo.innerHTML = logo(80, true, 'negative', 'ring-ready')
      const lb = splashLogo.querySelector('svg').getBoundingClientRect(), s = stage.getBoundingClientRect(), k = lb.width / 64
      const tx = lb.left + 27 * k - s.left, ty = lb.top + 27 * k - s.top, tr = 19 * k, tw = 7 * k
      const W = stage.clientWidth, H = stage.clientHeight
      morph.setAttribute('viewBox', `0 0 ${W} ${H}`)
      morph.innerHTML = `<circle class="dotted" fill="none" stroke="rgba(255,204,0,.95)" stroke-linecap="round"/><circle class="solid" fill="none" stroke="#fff" opacity="0"/>`
      const dotted = morph.querySelector('.dotted'), solid = morph.querySelector('.solid')
      ringsEl.classList.add('dim')
      // 1) o anel amarelo pontilhado (r=330, centro da tela) encolhe até a lente
      await tween(1300, (p) => {
        if (run !== running) return
        const q = ease(p), r = 330 + (tr - 330) * q
        const x = W / 2 + (tx - W / 2) * q, y = H / 2 + (ty - H / 2) * q
        const gap = 22 + (7 - 22) * q, w = 5 + (tw - 5) * q
        for (const c of [dotted, solid]) { c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r); c.setAttribute('stroke-width', w) }
        dotted.setAttribute('stroke-dasharray', `0 ${gap}`)
      })
      if (run !== running) return
      // 2) os pontos se fecham num anel branco contínuo
      await tween(450, (p) => { dotted.setAttribute('opacity', String(1 - p)); solid.setAttribute('opacity', String(p)) })
      if (run !== running) return
      // 3) a logo assume no mesmo lugar: o anel já está pronto; cabo, faixa e letras se desenham a partir dele
      splash.style.transition = 'none'
      splashLogo.innerHTML = logo(80, true, 'negative', 'ring-ready')
      splash.style.setProperty('--delay', '-0.25s')
      void splash.offsetWidth
      splash.classList.add('is-on')
      morph.innerHTML = ''
      await finish(2200)
    },
  }

  /** Amostra a forma da logo (texto + lente) em pontos, na posição em que a logo do splash será desenhada. */
  function sampleLogo() {
    const el = splashLogo, s = stage.getBoundingClientRect()
    const box = el.getBoundingClientRect()
    const W = Math.ceil(box.width), H = Math.ceil(box.height + 30)
    const c = document.createElement('canvas'); c.width = W; c.height = H
    const g = c.getContext('2d')
    // Letras nas posições reais
    const font = getComputedStyle(el).fontSize
    g.font = `800 ${font} Jakarta, system-ui, sans-serif`; g.textBaseline = 'alphabetic'; g.fillStyle = '#fff'
    el.querySelectorAll('.letter').forEach((l) => {
      const r = l.getBoundingClientRect(), m = g.measureText(l.textContent)
      g.fillText(l.textContent, r.left - box.left, r.top - box.top + m.actualBoundingBoxAscent + (r.height - m.actualBoundingBoxAscent) * 0.5)
    })
    // Lente: anel, cabo e faixas
    const lr = el.querySelector('svg').getBoundingClientRect(), k = lr.width / 64, ox = lr.left - box.left, oy = lr.top - box.top
    g.strokeStyle = '#fff'; g.lineCap = 'round'
    g.lineWidth = 7 * k; g.beginPath(); g.arc(ox + 27 * k, oy + 27 * k, 19 * k, 0, Math.PI * 2); g.stroke()
    g.lineWidth = 9 * k; g.beginPath(); g.moveTo(ox + 40.5 * k, oy + 40.5 * k); g.lineTo(ox + 55 * k, oy + 55 * k); g.stroke()
    g.fillStyle = 'rgb(255,204,0)'; g.fillRect(ox + 14 * k, oy + 19.5 * k, 26 * k, 8 * k)
    const data = g.getImageData(0, 0, W, H).data, pts = [], step = 5
    for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
      const i = (y * W + x) * 4
      if (data[i + 3] > 128) pts.push([x + box.left - s.left, y + box.top - s.top, data[i + 2] < 100])
    }
    return pts
  }

  function enterSite() {
    const run = ++running
    stack.classList.add('leaving')
    entrances[mode](run)
  }

  function reset() {
    running++
    timers.forEach(clearTimeout); timers = []; rafs.forEach(cancelAnimationFrame); rafs = []
    site.classList.remove('is-on'); splash.classList.remove('is-on'); stage.classList.remove('curtain'); again.hidden = true
    splash.style.removeProperty('--delay'); splash.style.transition = ''
    ringsEl.classList.remove('focus', 'wave-out', 'dim', 'pulse')
    particles.getContext('2d').clearRect(0, 0, particles.width, particles.height); particles.style.opacity = ''
    morph.innerHTML = ''
    stack.classList.remove('leaving')
    stack.querySelectorAll('.sheet').forEach((s) => { s.style.animation = 'none'; void s.offsetWidth; s.style.animation = '' })
    renderForm()
  }
  again.addEventListener('click', reset)

  function show() {
    mode = /^#a[1-3]$/.test(location.hash) ? location.hash.slice(1) : 'a1'
    document.querySelectorAll('.switcher a').forEach((a) => a.setAttribute('aria-current', String(a.hash === '#' + mode)))
    reset()
  }
  addEventListener('hashchange', show); show()
</script>
</body>
</html>
