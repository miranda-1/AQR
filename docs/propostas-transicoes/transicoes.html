<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AQR: transições de página</title>
<!--
  Pedido do responsável (09/10/2026): animações de transição entre páginas.
  Três propostas, com a barra oficial (duas faixas, sub-barra "sublinhado"):
  #t1 deslizar (no sentido do traço), #t2 em cascata, #t3 varredura.
  Clique em Início, Comparar PDFs ou Triagem documental (ou nos cartões do início) para ver.
  Arquivo estático: abra no navegador a partir do repositório.
-->
<style>
  @font-face {
    font-family: 'Jakarta';
    src: url('../../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2');
    font-weight: 200 800;
  }
  :root {
    --blue: #283587; --blue-50: #eef0f8; --blue-800: #1d2766; --yellow: #ffcc00;
    --ink: #1b2040; --muted: #4a5072; --subtle: #626886; --sunken: #f4f5f9; --line-strong: #8d92ab;
    --shadow-surface: 0 1px 2px rgba(27,32,64,.06), 0 2px 6px -2px rgba(27,32,64,.08);
    --shadow-raised: 0 2px 4px rgba(27,32,64,.06), 0 10px 24px -8px rgba(27,32,64,.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Jakarta', system-ui, sans-serif; color: var(--ink); background: var(--sunken); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  svg.i { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .switcher { position: fixed; z-index: 90; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px;
    background: rgba(27,32,64,.92); border-radius: 999px; box-shadow: 0 8px 24px -8px rgba(0,0,0,.4); max-width: calc(100vw - 16px); overflow-x: auto; }
  .switcher a { color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px; white-space: nowrap; }
  .switcher a[aria-current='true'] { background: #fff; color: var(--ink); }

  /* ---------- Barra oficial (duas faixas, sub-barra "sublinhado") ---------- */
  header { position: sticky; top: 0; z-index: 40; background: #fff; box-shadow: 0 1px 3px rgba(27,32,64,.08), 0 4px 12px -6px rgba(27,32,64,.10); }
  .top { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 20px; }
  .aqr { display: inline-flex; align-items: center; font-weight: 800; letter-spacing: -0.025em; line-height: 1; color: var(--blue); }
  .brand small { margin-left: 12px; font-size: 14px; color: var(--muted); }
  .right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .prefcg { height: 30px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .avatar { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 13px; font-weight: 700; }
  .subbar { background: var(--blue-50); }
  .subnav { position: relative; display: flex; gap: 4px; height: 48px; padding: 0 8px; overflow-x: auto; scrollbar-width: none; }
  .tab { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; flex-shrink: 0; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab[aria-current='page'] { color: var(--blue); font-weight: 700; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 6px; border-radius: 4px; background: #fff; color: var(--muted); }
  .indicator { position: absolute; bottom: 0; left: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--blue); transition: transform .3s ease-out, width .3s ease-out; }

  /* ---------- Área das páginas ---------- */
  .viewport { position: relative; overflow: hidden; min-height: calc(100vh - 104px); }
  .page { background: var(--sunken); }
  .page.is-leaving { position: absolute; inset: 0 0 auto 0; z-index: 2; pointer-events: none; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 120px; }
  .eyebrow { font-size: 14px; font-weight: 600; color: var(--blue); display: flex; align-items: center; gap: 8px; }
  .eyebrow::before { content: ''; width: 24px; height: 4px; border-radius: 2px; background: var(--yellow); }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin-top: 10px; }
  .lead { margin-top: 8px; font-size: 16px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .card { background: #fff; border-radius: 12px; box-shadow: var(--shadow-surface); }
  .opt { display: flex; gap: 16px; align-items: center; padding: 20px; margin-top: 16px; text-align: left; width: 100%; transition: box-shadow .2s, transform .2s; }
  .opt:hover { box-shadow: var(--shadow-raised); transform: translateY(-2px); }
  .opt .ico { width: 48px; height: 48px; border-radius: 10px; background: var(--blue-50); color: var(--blue); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .opt strong { display: block; font-size: 17px; }
  .opt span.d { display: block; margin-top: 4px; font-size: 14.5px; color: var(--muted); }
  .show { min-height: 360px; display: flex; align-items: center; justify-content: center; color: var(--subtle); font-size: 14px; }
  .slots { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; margin-top: 24px; align-items: center; }
  .slot { border: 2px dashed var(--line-strong); border-radius: 10px; background: #fff; height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-weight: 600; }
  .slot .btn { background: var(--blue); color: #fff; font-size: 14px; padding: 9px 16px; border-radius: 6px; }
  .swap { border: 1px solid var(--line-strong); border-radius: 6px; padding: 10px 8px; font-size: 12px; color: var(--muted); background: #fff; }
  .actions { display: flex; justify-content: flex-end; margin-top: 20px; }
  .primary { background: var(--blue); color: #fff; opacity: .5; font-weight: 700; padding: 13px 22px; border-radius: 6px; }
  .notice { display: flex; gap: 14px; padding: 20px; margin-top: 24px; }
  .notice p + p { margin-top: 10px; color: var(--muted); }
  .badge { display: inline-block; margin-left: 10px; vertical-align: middle; font-size: 12px; font-weight: 700; padding: 4px 7px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--muted); background: var(--sunken); }
  .sweep { position: absolute; top: 0; bottom: 0; width: 3px; z-index: 3; background: var(--yellow); box-shadow: 0 0 0 6px rgba(255,204,0,.12); pointer-events: none; }

  @media (max-width: 760px) {
    .brand small, .chip .name { display: none; }
    .grid2, .slots { grid-template-columns: 1fr; }
    h1 { font-size: 28px; }
    .right { gap: 8px; } .prefcg { height: 24px; }
  }
</style>
</head>
<body>

<nav class="switcher" aria-label="Transições">
  <a href="#t1">1 · Deslizar</a>
  <a href="#t2">2 · Em cascata</a>
  <a href="#t3">3 · Varredura</a>
</nav>

<header>
  <div class="top">
    <span class="brand"><span class="aqr" data-aqr="22"></span><small>Análise e Qualificação de Requerimentos</small></span>
    <div class="right">
      <img class="prefcg" src="../../src/assets/brand/prefcg-azul.svg" alt="Prefeitura de Campo Grande">
      <span class="chip"><span class="avatar">S</span><span class="name">servidor</span></span>
    </div>
  </div>
  <div class="subbar">
    <nav class="subnav" aria-label="Ferramentas" data-nav>
      <button class="tab" data-go="inicio"><span data-icon="home"></span>Início</button>
      <button class="tab" data-go="comparar"><span data-icon="files"></span>Comparar PDFs</button>
      <button class="tab" data-go="triagem"><span data-icon="search"></span>Triagem documental<span class="tag">Em breve</span></button>
      <span class="indicator" aria-hidden="true"></span>
    </nav>
  </div>
</header>

<div class="viewport" data-viewport aria-live="polite"></div>

<script>
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
  const icons = {
    home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    files: '<path d="M15 2H9a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7z"/><path d="M15 2v5h5"/><path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8"/>',
    search: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><circle cx="11.5" cy="14.5" r="2.5"/><path d="m13.3 16.3 1.7 1.7"/>',
    up: '<path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  }
  const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>`
  document.querySelectorAll('[data-icon]').forEach((el) => (el.outerHTML = icon(el.dataset.icon)))
  document.querySelectorAll('[data-aqr]').forEach((el) => {
    const size = Number(el.dataset.aqr), s = size * 1.1
    el.style.fontSize = size + 'px'; el.setAttribute('role', 'img'); el.setAttribute('aria-label', 'AQR')
    el.innerHTML = `<span aria-hidden="true">A</span><svg viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true" style="flex-shrink:0;margin:0 ${size * .02}px 0 ${size * .04}px;transform:translateY(${size * .12}px)">
      <path d="M40.5 40.5 L55 55" stroke="var(--blue)" stroke-width="9" stroke-linecap="round"/><circle cx="27" cy="27" r="19" fill="#fff" stroke="var(--blue)" stroke-width="7"/>
      <rect x="14" y="19.5" width="26" height="8" rx="2" fill="var(--yellow)"/><rect x="17" y="22" width="20" height="3.5" rx="1.75" fill="var(--blue)"/>
      <rect x="17" y="30.5" width="13" height="3.5" rx="1.75" fill="rgba(40,53,135,.35)"/></svg><span aria-hidden="true">R</span>`
  })

  // Páginas de exemplo (cada bloco com data-block entra em sequência na transição "em cascata").
  const pages = {
    inicio: `<div class="wrap"><div class="grid2">
      <div><p class="eyebrow" data-block>Ferramentas AQR</p><h1 data-block>Como podemos ajudar?</h1>
        <p class="lead" data-block>Escolha uma ferramenta para analisar e organizar seus documentos.</p>
        <button class="card opt" data-block data-go="comparar"><span class="ico">${icon('files')}</span><span><strong>Comparar PDFs</strong><span class="d">Compare duas versões de um documento e identifique o que mudou.</span></span></button>
        <button class="card opt" data-block data-go="triagem"><span class="ico">${icon('search')}</span><span><strong>Triagem documental</strong><span class="d">Identifique cada documento do processo e confira os obrigatórios.</span></span></button></div>
      <div class="card show" data-block>Demonstração animada da ferramenta</div></div></div>`,
    comparar: `<div class="wrap"><h1 data-block>Comparar documentos</h1><p class="lead" data-block>Selecione o documento original e a versão atualizada.</p>
      <div class="slots" data-block><div class="slot">${icon('up')}Arraste o PDF para cá<span class="btn">Selecionar arquivo</span></div><span class="swap">Inverter</span>
      <div class="slot">${icon('up')}Arraste o PDF para cá<span class="btn">Selecionar arquivo</span></div></div>
      <div class="actions" data-block><span class="primary">Comparar documentos</span></div></div>`,
    triagem: `<div class="wrap" style="max-width:760px"><h1 data-block>Triagem documental<span class="badge">Em desenvolvimento</span></h1>
      <div class="card notice" data-block><span style="color:var(--blue)">${icon('info')}</span><div><p>Esta funcionalidade ainda não está disponível.</p>
      <p>A triagem vai analisar os documentos de um processo, identificar o tipo de cada um e verificar os obrigatórios.</p></div></div></div>`,
  }
  const order = ['inicio', 'comparar', 'triagem']
  const viewport = document.querySelector('[data-viewport]')
  const nav = document.querySelector('[data-nav]')
  const indicator = nav.querySelector('.indicator')
  let current = null, mode = 't1', busy = []

  function placeIndicator() {
    const active = nav.querySelector('[aria-current="page"]')
    indicator.style.width = active.offsetWidth + 'px'
    indicator.style.transform = `translateX(${active.offsetLeft}px)`
  }
  function makePage(id) {
    const el = document.createElement('div')
    el.className = 'page'; el.innerHTML = pages[id]
    el.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)))
    return el
  }
  const ease = 'cubic-bezier(.2,.7,.2,1)'

  const transitions = {
    // 1) Deslizar: no mesmo sentido do traço da sub-barra.
    t1(oldEl, newEl, dir) {
      const a = oldEl.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-dir * 48}px)` }], { duration: 220, easing: 'ease-in', fill: 'forwards' })
      const b = newEl.animate([{ opacity: 0, transform: `translateX(${dir * 48}px)` }, { opacity: 1, transform: 'none' }], { duration: 340, delay: 90, easing: ease, fill: 'backwards' })
      return [a, b]
    },
    // 2) Em cascata: a página atual some rápido; os blocos da nova sobem um após o outro.
    t2(oldEl, newEl) {
      const anims = [oldEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, fill: 'forwards' })]
      newEl.querySelectorAll('[data-block]').forEach((block, i) => {
        anims.push(block.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }],
          { duration: 380, delay: 100 + i * 55, easing: ease, fill: 'backwards' }))
      })
      return anims
    },
    // 3) Varredura: a linha amarela passa e troca a página antiga pela nova por onde passa.
    t3(oldEl, newEl, dir) {
      const line = document.createElement('div'); line.className = 'sweep'; viewport.appendChild(line)
      const w = viewport.clientWidth
      const from = dir > 0 ? 0 : w, to = dir > 0 ? w : 0
      const timing = { duration: 460, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' }
      const a = line.animate([{ transform: `translateX(${from}px)`, opacity: 1 }, { transform: `translateX(${to}px)`, opacity: 1, offset: .92 }, { transform: `translateX(${to}px)`, opacity: 0 }], timing)
      const clipFrom = 'inset(0 0 0 0)', clipTo = dir > 0 ? 'inset(0 0 0 100%)' : 'inset(0 100% 0 0)'
      const b = oldEl.animate([{ clipPath: clipFrom }, { clipPath: clipTo, offset: .92 }, { clipPath: clipTo }], timing)
      a.finished.then(() => line.remove(), () => line.remove())
      return [a, b]
    },
  }

  function go(id) {
    if (id === current) return
    const dir = current ? Math.sign(order.indexOf(id) - order.indexOf(current)) : 0
    busy.forEach((a) => a.finish()); busy = []
    viewport.querySelectorAll('.page.is-leaving, .sweep').forEach((el) => el.remove())
    nav.querySelectorAll('[data-go]').forEach((b) => b.dataset.go === id ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'))
    placeIndicator()
    const oldEl = viewport.querySelector('.page'), newEl = makePage(id)
    current = id
    if (!oldEl || reduced) { viewport.replaceChildren(newEl); return }
    oldEl.classList.add('is-leaving')
    viewport.appendChild(newEl)
    busy = transitions[mode](oldEl, newEl, dir || 1)
    Promise.all(busy.map((a) => a.finished)).then(() => oldEl.remove(), () => oldEl.remove())
  }
  nav.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)))
  addEventListener('resize', placeIndicator)

  function show() {
    mode = /^#t[1-3]$/.test(location.hash) ? location.hash.slice(1) : 't1'
    document.querySelectorAll('.switcher a').forEach((a) => a.setAttribute('aria-current', String(a.hash === '#' + mode)))
  }
  addEventListener('hashchange', show); show()
  go('inicio')
</script>
</body>
</html>
